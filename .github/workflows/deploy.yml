# Deploys main to the AWS demo environment (docs/06, section 4), with no
# manual step: after CI passes on main, it builds the arm64 images, pushes
# them to ECR tagged with the commit SHA, uploads the release's compose file
# and Caddyfile, then runs scripts/deploy/release.sh, which migrates,
# deploys, waits until ready, runs the smoke tests against the public URL,
# and deploys the previous release again if anything fails.
#
# It assumes the deploy role through GitHub's OIDC token: no AWS keys are
# stored. Everything it needs is in the GitHub environment "demo" (limited
# to main), filled from Terraform's outputs (infra/terraform/README.md):
#   vars.AWS_DEPLOY_ROLE_ARN   deploy_role_arn
#   vars.AWS_REGION            eu-west-2
#   vars.ECR_REGISTRY          <account>.dkr.ecr.<region>.amazonaws.com
#   vars.RELEASES_BUCKET       releases_bucket
#   vars.HOST_INSTANCE_ID      host_instance_id
#   vars.DEPLOY_DOCUMENT       deploy_document
#   vars.SITE_URL              site_url
#
# Run it by hand to redeploy a commit, or to rehearse a rollback: with
# "break_smoke_test", the smoke tests fail on purpose and the previous
# release comes back (M10's exit criteria).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (the head of main if empty)"
        required: false
      break_smoke_test:
        description: Make the smoke tests fail, to rehearse the automatic rollback
        type: boolean
        default: false

# One deploy at a time, and never cancelled halfway: a cancelled deploy could
# leave the host between two releases.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to the demo environment
    # Only a green CI run on main (a push, not a pull request), or by hand;
    # and only once the AWS environment exists: the repository variable
    # DEPLOY_ENABLED is set to "true" as the last step of its setup
    # (infra/terraform/README.md). Until then, nothing runs and fails.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment:
      name: demo
      url: ${{ vars.SITE_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.ECR_REGISTRY }}
    steps:
      - name: Choose the commit
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$HEAD_SHA}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full commit SHA: $sha" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      # Tags never move (immutable): a commit already pushed, as when an
      # older one is deployed again, is not built twice.
      - name: Build and push the arm64 images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for target in api web; do
            image="$REGISTRY/goliveboard-$target:$SHA"
            if aws ecr describe-images --repository-name "goliveboard-$target" \
                 --image-ids imageTag="$SHA" >/dev/null 2>&1; then
              echo "$image is already in ECR"
              continue
            fi
            docker build --file infra/docker/Dockerfile --target "$target" --tag "$image" .
            # This build, not CI's, is what runs: it gets CI's package check
            # too (the runtime upgrades its OS packages as it builds).
            scripts/check-image-packages.sh "$image"
            docker push "$image"
          done

      - name: Upload the release's files
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          BUCKET: ${{ vars.RELEASES_BUCKET }}
        run: |
          aws s3 cp --only-show-errors infra/deploy/docker-compose.aws.yml "s3://$BUCKET/$SHA/docker-compose.yml"
          aws s3 cp --only-show-errors infra/deploy/Caddyfile.aws "s3://$BUCKET/$SHA/Caddyfile"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the smoke tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Migrate, deploy, smoke-test, and roll back on failure
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          INSTANCE_ID: ${{ vars.HOST_INSTANCE_ID }}
          DEPLOY_DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMOKE_FORCE_FAILURE: ${{ inputs.break_smoke_test && '1' || '' }}
          SMOKE_COMMAND: E2E_TARGET=deployed DEPLOYED_URL="$SITE_URL" npx playwright test
        run: bash scripts/deploy/release.sh

      - name: Keep the smoke tests' report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-smoke-report
          path: playwright-report
          retention-days: 14
