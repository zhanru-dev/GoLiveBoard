# Continuous integration: every pull request and every push to main.
# Jobs run in parallel where they do not depend on each other; the final
# "CI result" job is the single check that branch protection requires.
#
# Actions are pinned to full commit SHAs (a tag can be moved to malicious
# code; a SHA cannot). Dependabot keeps the pins up to date.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (format, lint, types, architecture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub-hosted Ubuntu runners include Docker, which Testcontainers uses
      # to start PostgreSQL and Valkey for these tests.
      - run: npm run test:int

  security:
    name: Security (dependency audit, secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Production dependencies only: development tools never reach users.
      # (docs/06-infrastructure-and-operations.md, "Dependency audit")
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the history for secrets
        run: ./gitleaks git --redact --verbose .

  build:
    name: Build
    needs: [quality, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end tests
    needs: [quality, unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The apps run on the runner and the proxy in a container, which on
      # Linux reaches the host only on 0.0.0.0 (docs/06, section 1.2).
      API_HOST: 0.0.0.0
      WEB_HOST: 0.0.0.0
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: postgres://opspilot:opspilot@127.0.0.1:5443/opspilot
      VALKEY_URL: redis://127.0.0.1:6392
      APP_ORIGIN: http://localhost:3300
      JWT_SECRET: ci-only-signing-key-that-is-long-enough
      SMTP_URL: smtp://127.0.0.1:1036
      MAIL_FROM: OpsPilot <no-reply@opspilot.test>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL, Valkey, Mailpit and the proxy
        run: npm run services:up
      - run: npm run db:deploy
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [quality, unit, integration, security, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
