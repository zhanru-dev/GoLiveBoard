# Continuous integration: every pull request and every push to main.
# Jobs run in parallel where they do not depend on each other; the final
# "CI result" job is the single check that branch protection requires.
#
# Actions are pinned to full commit SHAs (a tag can be moved to malicious
# code; a SHA cannot). Dependabot keeps the pins up to date.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (format, lint, types, architecture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Also fails if domain/ folders drop below 90% line or branch coverage.
      - run: npm run test:coverage

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub-hosted Ubuntu runners include Docker, which Testcontainers uses
      # to start PostgreSQL and Valkey for these tests.
      - run: npm run test:int

  security:
    name: Security (dependency audit, secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Production dependencies only: development tools never reach users.
      # Advisories reviewed and allowed, each until a date, are listed in
      # audit-allowlist.json (docs/06-infrastructure-and-operations.md,
      # "Dependency audit").
      - name: Audit production dependencies
        run: node scripts/audit.mjs
      # Overrides in package.json (effect, for Prisma's config) must leave a
      # valid tree: the overridden package where its parent finds it, and no
      # one else's peer range broken by it. Read from the lock: this job
      # installs nothing.
      - name: Overridden packages resolve as declared
        run: npm ls --package-lock-only effect basic-ftp --all
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the history for secrets
        run: ./gitleaks git --redact --verbose .

  # The production images, built natively for each platform the demo host
  # may run (it is ARM), scanned, then tested as they will run: the stack in
  # docker-compose.prod.yml over HTTPS, with every browser test and the smoke
  # tests (docs/06, section 1.4).
  infrastructure:
    name: Infrastructure (Terraform fmt, validate, tests, tflint, checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No AWS account is used: providers are mocked in the tests, and
      # validate and the scanners read the code only (docs/06, section 5).
      - name: Check the Terraform
        env:
          # Read-only, for tflint's download of the AWS ruleset (GitHub's
          # anonymous API limit is shared by everyone on the runner's address).
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/infra-check.sh all

  images:
    name: Images (${{ matrix.platform }})
    needs: [quality, unit, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The hosted runner comes with toolchains this job never uses; with
      # the images and Grafana's data the disk filled to 95%, and object
      # storage then had no room to grow its volumes (CI run 44404770745).
      - name: Free disk space for the images and the stack
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the api and web images
        run: docker compose --file docker-compose.prod.yml build
      # Fixable HIGH and CRITICAL vulnerabilities fail the build, and so does
      # any secret found in an image. Unfixed ones are reported by Dependabot
      # and Trivy runs once a fix exists.
      - name: Scan the images (Trivy)
        run: |
          for image in goliveboard-api:local goliveboard-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image --no-progress --scanners vuln,secret \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Start the production-like stack
        run: npm run stack:up
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser and smoke tests against the stack, over HTTPS
        run: npm run test:e2e:stack
      # The public event page's budget (NFR-3), on the seeded demo event, as
      # a mid-range phone on slow 4G. Once, on amd64: the same page and
      # budget would only measure the runner twice.
      - name: Lighthouse on the public event page
        if: matrix.platform == 'linux/amd64'
        run: |
          site=https://goliveboard.localhost:3443
          jar="$(mktemp)"
          curl -sSfk -c "$jar" -X POST -H "Origin: $site" "$site/api/v1/auth/demo"
          slug="$(curl -sSfk -b "$jar" "$site/api/v1/events?q=Autumn" | jq -r '.items[0].slug')"
          LIGHTHOUSE_URL="$site/e/$slug" \
          CHROME_PATH="$(node -e "import('@playwright/test').then((m) => console.log(m.chromium.executablePath()))")" \
            npm run lighthouse
      - name: Keep the Lighthouse reports
        if: always() && matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          # A dot directory: upload-artifact skips those unless told.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Show the stack's logs after a failure
        if: failure()
        run: docker compose --file docker-compose.prod.yml logs --no-color --timestamps
      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.runner }}
          path: playwright-report
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [quality, unit, integration, security, infrastructure, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
