# Weekly dependency updates as pull requests, which CI then verifies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One pull request for all minor and patch updates; majors arrive one by
      # one, because each may need code changes.
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The Node.js base image in infra/docker/Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]

  # The service images in docker-compose.yml and docker-compose.prod.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      service-images:
        update-types: [minor, patch]
